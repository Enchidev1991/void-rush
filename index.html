<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#05060b" />
  <title>VOID//RUSH Prototype</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="brand">VOID//RUSH <span>PROTOTYPE 01</span></div>
    <div class="speed"><span id="speed">0</span><small>KM/H</small></div>
    <div class="hint">DRAG TO STEER</div>
  </div>

  <div id="touch">
    <button id="brake">BRAKE</button>
    <button id="boost">THRUST</button>
  </div>

  <div id="start">
    <div class="panel">
      <h1>VOID//RUSH</h1>
      <p>One ship. One test circuit. First handling prototype.</p>
      <button id="startBtn">ENGAGE</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
